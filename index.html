<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tu Tiên Giới</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101522;color:#eee;font-family:Arial,sans-serif}
header{background:#202b40;padding:18px;text-align:center;color:#ffd875}
main{max-width:600px;margin:auto;padding:15px}
.card{background:#202b40;border:1px solid #475875;border-radius:14px;padding:16px;margin-bottom:14px}
h2{color:#ffd875;margin-top:0}
button{background:#a87932;color:white;border:0;border-radius:9px;padding:12px;margin:4px;font-weight:bold}
button:active{opacity:.7}
.bar{height:12px;background:#414b60;border-radius:8px;overflow:hidden}
.fill{height:100%;background:#42d69b;width:0%}
#scene{height:180px;background:linear-gradient(#25365c,#151c2c);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:70px}
.small{color:#b7c5dd;font-size:14px}
</style>
</head>
<body>
<header>
<h1>☯ TU TIÊN GIỚI ☯</h1>
<div>Con đường nghịch thiên bắt đầu!</div>
</header>
<main>
<div class="card" id="choose">
<h2>Chọn đạo tu hành</h2>
<p>☀️ Tiên đạo: cân bằng, phòng thủ tốt.</p>
<button onclick="start('Tiên')">Tu Tiên</button>
<p>🌑 Ma đạo: công kích mạnh, tốc độ cao.</p>
<button onclick="start('Ma')">Tu Ma</button>
</div>

<div id="game" hidden>
<div class="card">
<div id="scene">🏯</div>
<h2 id="name">Tu sĩ</h2>
<p id="realm">Cảnh giới: Luyện Khí · Tầng 1 · Bậc 1</p>
<p>Linh khí: <b id="qi">0</b></p>
<div class="bar"><div class="fill" id="progress"></div></div>
<p id="need" class="small"></p>
<button onclick="cultivate()">🧘 Tu luyện</button>
<button onclick="breakthrough()">⚡ Đột phá</button>
</div>

<div class="card">
<h2>📊 Thuộc tính</h2>
<p id="stats"></p>
</div>

<div class="card">
<h2>🗺️ Hành động</h2>
<button onclick="explore()">⚔️ Đi săn</button>
<button onclick="showBag()">🎒 Túi đồ</button>
<button onclick="showInfo()">📜 Hướng dẫn</button>
<div id="message" class="small">Chào mừng đến với Tu Tiên Giới!</div>
</div>
</div>
</main>
<script>
let player=null;
let realms=["Luyện Khí","Trúc Cơ","Kim Đan","Nguyên Anh","Hóa Thần","Luyện Hư","Hợp Thể","Đại Thừa"];
function start(faction){
player={faction:faction,realm:0,tier:1,stage:1,qi:0,level:1,attack:faction==="Tiên"?15:20,hp:faction==="Tiên"?40:30,def:faction==="Tiên"?10:5,speed:faction==="Tiên"?5:10,luck:faction==="Tiên"?0:5,comprehension:faction==="Tiên"?0:5,bag:{}};
document.getElementById("choose").hidden=true;
document.getElementById("game").hidden=false;
document.getElementById("name").textContent="Tu sĩ "+faction;
render();
}
function cost(){return Math.ceil(100*Math.pow(1.35,player.level-1))}
function render(){
document.getElementById("realm").textContent="Cảnh giới: "+(realms[player.realm]||"Tiên Nhân")+" · Tầng "+player.tier+" · Bậc "+player.stage;
document.getElementById("qi").textContent=Math.floor(player.qi);
document.getElementById("need").textContent="Cần "+cost()+" linh khí để tăng cấp";
document.getElementById("progress").style.width=Math.min(100,player.qi/cost()*100)+"%";
document.getElementById("stats").textContent="Công: "+player.attack+" | Máu: "+player.hp+" | Thủ: "+player.def+" | Tốc độ: "+player.speed+" | May mắn: "+player.luck+" | Ngộ tính: "+player.comprehension;
}
function cultivate(){
player.qi+=1;
if(player.qi>=cost()){
player.qi-=cost();
player.level++;
player.stage++;
if(player.stage>10){player.stage=1;player.tier++}
if(player.tier>10){player.tier=1;player.realm++}
document.getElementById("message").textContent="✨ Tu vi tăng tiến!";
}
render();
}
function breakthrough(){
let chance=player.stage<=3?5:player.stage<=6?15:player.stage<=9?30:40;
if(player.stage===10&&player.tier===10)chance=60;
if(player.qi<cost()*3){document.getElementById("message").textContent="Chưa đủ linh khí để đột phá!";return}
if(Math.random()*100<chance){
player.qi=Math.ceil(player.qi*.8);
document.getElementById("message").textContent="❌ Đột phá thất bại! Mất 20% linh khí.";
}else{
player.qi-=cost()*3;
player.stage=1;player.tier++;
if(player.tier>10){player.tier=1;player.realm++}
player.level++;
document.getElementById("message").textContent="🌟 Đột phá thành công!";
}
render();
}
function explore(){
let reward=Math.floor(Math.random()*4)+1;
player.bag["Mảnh "+reward]=(player.bag["Mảnh "+reward]||0)+1;
document.getElementById("message").textContent="⚔️ Đi săn xong! Nhận được 1 Mảnh "+reward+".";
}
function showBag(){
document.getElementById("message").textContent="🎒 Túi đồ: "+(Object.keys(player.bag).map(k=>k+" x"+player.bag[k]).join(", ")||"Trống");
}
function showInfo(){
document.getElementById("message").textContent="Linh khí tự tăng 1 mỗi giây khi đang mở game. Đây là bản thử nghiệm, dữ liệu chưa lưu khi thoát.";
}
setInterval(()=>{if(player){player.qi++;render()}},1000);
</script>
</body>
  </html>
